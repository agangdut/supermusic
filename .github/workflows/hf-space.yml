name: Hugging Face Space

# Publishes the backend to a Hugging Face Space (Docker) so the GitHub Pages site has an API.
# Needs a repository secret HF_TOKEN (a Hugging Face write token) on an account with PRO, since
# Docker Spaces need it. Run by hand from the Actions tab; then set the API_BASE variable.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''

      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.10"

      - name: Publish the Space
        if: env.HF_TOKEN != ''
        run: |
          pip install huggingface_hub
          python deploy/hf-space/publish.py

      - name: No token
        if: env.HF_TOKEN == ''
        run: echo "::notice::Add a HF_TOKEN repository secret to publish the backend to Hugging Face."
