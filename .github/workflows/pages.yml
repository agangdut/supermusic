name: Pages demo

# Publishes the frontend as a static demo at https://agangdut.github.io/supermusic/.
# The API runs on a Hugging Face Space (hf-space.yml) when the HF_TOKEN secret is set. Without
# it, or while the Space is asleep, the Music Map still shows the sample library baked below.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEMO: "1"
      NEXT_PUBLIC_BASE_PATH: /supermusic
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bake the sample map
        run: |
          pip install pandas numpy scikit-learn umap-learn
          python scripts/build_demo_map.py frontend/public/demo/sample-map.json

      - name: Point the site at the Hugging Face Space, if there is one
        if: env.HF_TOKEN != ''
        run: |
          pip install huggingface_hub
          host=$(python -c "from huggingface_hub import HfApi; print(HfApi().whoami()['name'].replace('_','-').lower())")
          echo "NEXT_PUBLIC_API_BASE=https://${host}-supermusic.hf.space" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        run: |
          # Shared-map preview pages render on the server, which a static export can't do
          rm -f "pages/s/[id].js"
          npm ci
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
