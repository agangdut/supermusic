services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/supermusic.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - SUPERMUSIC_ARTIFACT_DIR=/app/data/artifacts
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - TORCH_HOME=/app/data/models/torch
      - YOURMT3_URL=http://yourmt3:8100
      - MUSCRIPTOR_URL=http://muscriptor:8200
      - MUSCRIPTOR_REF_URL=http://muscriptor_ref:8222
      - CLAP_URL=http://clap:8300
      - GAME_URL=http://game:8300
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - ./scripts:/app/scripts   # so `git pull` updates the scripts without a rebuild
    restart: unless-stopped

  # Multi-instrument transcription (YourMT3+). Runs on CPU by default;
  # docker-compose.gpu.yml puts it on an NVIDIA GPU, which is much faster.
  yourmt3:
    build: ./services/yourmt3
    environment:
      - WANDB_MODE=disabled
      - HF_HOME=/app/data/models/hf
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Multi-instrument transcription (MuScriptor, 2026). Its weights are gated:
  # accept the licence on https://huggingface.co/MuScriptor/muscriptor-medium
  # and put HF_TOKEN=hf_... in .env. Non-commercial use only (CC BY-NC 4.0).
  muscriptor:
    build: ./services/muscriptor
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/models/hf
      - MUSCRIPTOR_MODEL=${MUSCRIPTOR_MODEL:-medium}
      - MUSCRIPTOR_FAST=${MUSCRIPTOR_FAST:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # The official MuScriptor server, built straight from Kyutai/Mirelo's repo, so
  # our wrapper (the `muscriptor` service above) can be checked against it. Only
  # starts when asked for:  docker compose --profile ref up -d muscriptor_ref
  # Shares the downloaded weights with `muscriptor`. Its own web UI: http://localhost:8222
  muscriptor_ref:
    profiles: ["ref"]
    build: https://github.com/muscriptor/muscriptor.git#7f213afecf23bd6a1b8672aa223690ee9807cefb
    command: ["--port", "8222", "--model", "${MUSCRIPTOR_MODEL:-medium}"]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/app/data/models/hf
    ports:
      - "8222:8222"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Singing-voice transcription (GAME, OpenVPI 2026) for the Lead vocal track.
  # Weights download on first use; non-commercial use only (CC BY-NC-SA 4.0).
  game:
    build: ./services/game
    environment:
      - GAME_MODEL=${GAME_MODEL:-medium}
      - TORCH_HOME=/app/data/models/torch   # shares the Demucs weights with the backend
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # CLAP (LAION) for the Music Map's "sound" feature and describe-a-vibe search.
  # Small enough for the CPU; docker-compose.gpu.yml puts it on the GPU.
  clap:
    build: ./services/clap
    environment:
      - HF_HOME=/app/data/models/hf
      - CLAP_MODEL=${CLAP_MODEL:-laion/clap-htsat-unfused}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - NEXT_PUBLIC_ARTIFACT_BASE=http://localhost:8000/artifacts
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:

