[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supermusic"
version = "0.1.0"
description = "A Python pipeline and web app for downloading, processing, and visualizing music data."
readme = "README.md"
authors = [
    { name = "Agang Dut" }
]
license = { file = "LICENSE" }
keywords = ["music", "audio", "visualization", "web"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "librosa",
    "pydub",
    "fastapi",
    "uvicorn",
    "jinja2",
    "plotly",
    "umap-learn",
    "click"
]

[project.urls]
Homepage = "https://github.com/yourname/supermusic"
Documentation = "https://github.com/yourname/supermusic/docs"
Issues = "https://github.com/yourname/supermusic/issues"

[tool.setuptools.packages.find]
where = ["supermusic"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[project.scripts]
supermusic = "supermusic.cli.main:cli"
